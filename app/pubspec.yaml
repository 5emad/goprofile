name: goprofile
description: "goprofile: activity, tasks and work logs."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  pointycastle: ^4.0.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: IRANYekanX
      fonts:
        - asset: assets/fonts/IRANYekanXFaNum-Light.ttf
          weight: 300
        - asset: assets/fonts/IRANYekanXFaNum-Regular.ttf
          weight: 400
        - asset: assets/fonts/IRANYekanXFaNum-Medium.ttf
          weight: 500
        - asset: assets/fonts/IRANYekanXFaNum-DemiBold.ttf
          weight: 600
        - asset: assets/fonts/IRANYekanXFaNum-Bold.ttf
          weight: 700
        - asset: assets/fonts/IRANYekanXFaNum-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/IRANYekanXFaNum-Black.ttf
          weight: 900
