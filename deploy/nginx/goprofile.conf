# Installed by deploy/scripts/server-setup.sh to /etc/nginx/sites-available/goprofile.
# Certificates come from certbot (Let's Encrypt).

limit_req_zone $binary_remote_addr zone=gp_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=gp_key:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=gp_conn:10m;

map $http_upgrade $gp_connection { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name goprofile.ir www.goprofile.ir;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://goprofile.ir$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.goprofile.ir;
    ssl_certificate     /etc/letsencrypt/live/goprofile.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goprofile.ir/privkey.pem;
    return 301 https://goprofile.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name goprofile.ir;

    ssl_certificate     /etc/letsencrypt/live/goprofile.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goprofile.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:gp_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 15s;
    limit_conn gp_conn 40;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    root /var/www/goprofile;
    index index.html;

    # Only the key endpoint and the encrypted gateway reach the API.
    location = /api/key {
        limit_req zone=gp_key burst=10 nodelay;
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/goprofile-proxy.conf;
    }

    location = /api/x {
        limit_req zone=gp_api burst=40 nodelay;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/goprofile-proxy.conf;
    }

    location /api/ { return 404; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    }

    location ~ /\. { deny all; }

    location / {
        try_files $uri /index.html;
    }
}
